<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Compute Leaderboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <header>
      <p class="kicker">Integer factoring · 5.00s window</p>
      <h1>Compute Leaderboard</h1>
      <p class="lede">
        Your browser factors random 12-digit integers as fast as it can.
        Score is how many numbers are fully factored in five seconds.
      </p>
    </header>

    <section class="bench" aria-labelledby="bench-heading">
      <h2 id="bench-heading" class="visually-hidden">Benchmark</h2>

      <label class="name-field">
        <span>Display name</span>
        <input id="name" type="text" maxlength="24" autocomplete="nickname" placeholder="anonymous" />
      </label>

      <div class="meter" aria-live="polite">
        <div class="meter-top">
          <span id="status">Idle</span>
          <span id="clock">5.00s</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <i id="bar-fill"></i>
        </div>
        <p class="score-readout">
          <span id="live-score">0</span>
          <small>numbers factored</small>
        </p>
        <p class="ops" id="live-ops">0 trial divisions</p>
      </div>

      <div class="actions">
        <button id="run" type="button">Run benchmark</button>
        <button id="post" type="button" disabled>Post score</button>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="board-wrap" aria-labelledby="board-heading">
      <div class="board-head">
        <h2 id="board-heading">Board</h2>
        <button id="refresh" type="button" class="ghost">Refresh</button>
      </div>
      <p class="store-note" id="store-note"></p>
      <ol id="board" class="board"></ol>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
